name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject config
        env:
          CONFIG_JS: ${{ secrets.CONFIG_JS }}
        run: |
          if [ -z "$CONFIG_JS" ]; then
            echo "⚠️  CONFIG_JS secret not set, using config.example.js"
            cp assets/config.example.js assets/config.js
          else
            printf '%s\n' "$CONFIG_JS" > assets/config.js
          fi
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4